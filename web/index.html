<!DOCTYPE html>
<html lang="en-CA">
<head>
  <!--
    Replaced by the value of the `--base-href` argument to `flutter build`.
    Must start and end with a slash. Leave it alone.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <title>Astro Math Assist</title>
  <meta name="description" content="Ontario high-school maths practice that shows a student what they got wrong and why. Grades 9 to 12, 1,600 questions, with a report their tutor and their parents can read.">
  <meta name="application-name" content="Astro Math Assist">

  <!-- The browser chrome picks up these; the two together stop a white
       flash on light and a black one on dark before Flutter paints. -->
  <meta name="theme-color" content="#2F6F62" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#20514A" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- iOS home-screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Astro Math">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Shared report links are opened by parents, often from a phone
       message, so they get a real card rather than a bare URL. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Astro Math Assist">
  <meta property="og:description" content="Ontario high-school maths practice, grades 9 to 12.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <style>
    /* The page under Flutter. Without this the browser paints its own
       white — a hard flash on a dark phone — before the canvas appears. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F6F5F1;
      overscroll-behavior: none;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #121716; }
      #boot .mark { opacity: .85; }
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Fades out on its own; if Flutter is quick nobody ever sees it. */
      animation: boot-in .45s ease-out .25s both;
    }
    #boot .mark { width: 76px; height: 76px; }
    @keyframes boot-in { from { opacity: 0 } to { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      #boot { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Removed by the Flutter loader's first frame. Purely so a slow
       connection shows the mark instead of an empty page. -->
  <div id="boot" aria-hidden="true">
    <img class="mark" src="icons/Icon-192.png" alt="">
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b && b.parentNode) b.parentNode.removeChild(b);
    });
  </script>
</body>
</html>
