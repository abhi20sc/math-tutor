<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Astro Math Assist">
  <!-- Direction 1 — Constellation A.
       The letter A drawn the way a star chart draws a constellation: five
       plotted points joined by faint lines. It is the only one of these that
       says "astro" and "plot a point" with the same mark, and it survives
       being shrunk to a 16px favicon because the shape is carried by the
       dots, not by the strokes. -->
  <g fill="none" stroke="#2F6F62" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <path d="M32 11 L13 53"/>
    <path d="M32 11 L51 53"/>
    <path d="M21.5 34.5 L42.5 34.5"/>
  </g>
  <g fill="#2F6F62">
    <circle cx="13"   cy="53"   r="3.4"/>
    <circle cx="51"   cy="53"   r="3.4"/>
    <circle cx="21.5" cy="34.5" r="3"/>
    <circle cx="42.5" cy="34.5" r="3"/>
  </g>
  <!-- The apex is the bright one: the star you steer by. -->
  <circle cx="32" cy="11" r="5.6" fill="#2F6F62"/>
  <circle cx="32" cy="11" r="2.1" fill="#F6F5F1"/>
</svg>
